# Render Blueprint — multi-tenant WhatsApp AI stack
# Connect repo: https://github.com/Edev01/Watsapp-Web-ML
#
# After deploy, set env vars in Render dashboard (secrets are not committed):
#   DATABASE_URL, LLM_API_KEY, JWT_SECRET (Node service)

services:
  # Python AI API + in-process normalize worker (wake on scrape)
  - type: web
    name: whatsapp-ai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_BASE_URL
        value: https://api.together.ai/v1
      - key: LLM_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: openai/gpt-oss-20b
      - key: EMBED_ENABLED
        value: "false"
      - key: CHECK_INTERVAL
        value: "15"
      - key: NORMALIZE_CONCURRENCY
        value: "8"
      - key: NORMALIZE_BATCH_SIZE
        value: "30"
      - key: NORMALIZE_PER_USER_BATCH
        value: "4"
      - key: NORMALIZE_FAIR_SCHEDULE
        value: "true"
      - key: NORMALIZE_MAX_ROUNDS
        value: "10"
      - key: NORMALIZE_PREFILTER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Dedicated always-on normalizer (processes backlog + per-user jobs)
  - type: worker
    name: whatsapp-normalize-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python auto_pipeline.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_BASE_URL
        value: https://api.together.ai/v1
      - key: LLM_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: openai/gpt-oss-20b
      - key: EMBED_ENABLED
        value: "false"
      - key: CHECK_INTERVAL
        value: "15"
      - key: NORMALIZE_CONCURRENCY
        value: "8"
      - key: NORMALIZE_BATCH_SIZE
        value: "30"
      - key: NORMALIZE_PER_USER_BATCH
        value: "4"
      - key: NORMALIZE_FAIR_SCHEDULE
        value: "true"
      - key: NORMALIZE_MAX_ROUNDS
        value: "10"
      - key: NORMALIZE_PREFILTER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Node.js backend (dashboard + scraper API)
  - type: web
    name: whatsapp-node-backend
    runtime: node
    plan: starter
    rootDir: Watsapp_Web_backend-main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_AI_URL
        fromService:
          name: whatsapp-ai-api
          type: web
          property: host
      - key: PORT
        value: "10000"
